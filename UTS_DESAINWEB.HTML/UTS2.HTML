<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CreativeSpace - Welcome Back</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

          <div class="brand">
                    <img src="REATIVE SPACE.png"
         width="450px"height="250px
         


    <!-- LOGIN -->
    <main class="login">

        <!-- LOGO ICON -->
        <div class="logo-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>


        <h2>Welcome back</h2>


        <!-- GOOGLE -->
        <button class="google-button">
            <span class="google-logo">G</span>
            Continue with Google
        </button>


        <!-- PEMISAH -->
        <div class="or">
            <span>or</span>
        </div>


        <!-- EMAIL -->
        <input
            type="text"
            placeholder="Enter email or username"
            class="email-input"
        >


        <!-- CONTINUE -->
        <button class="continue-button">
            Continue
        </button>


        <!-- TERMS -->
        <p class="terms">
            By continuing, you agree to our
            <a href="#">Terms</a>
            and
            <a href="#">Privacy Policy</a>.
        </p>


        <!-- SIGN UP -->
        <p class="signup">
            Don't have an account?
            <a href="#">Sign up</a>
        </p>

    </main>

</body>
</html>
